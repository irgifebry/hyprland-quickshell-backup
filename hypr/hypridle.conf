# Lock via Quickshell's built-in lock screen (end4-pC).
# $lock_cmd = qs -c $qsConfig ipc call lock activate
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = qs -c end4-pC ipc call lock activate
    before_sleep_cmd = qs -c end4-pC ipc call lock activate
    after_sleep_cmd = qs -c end4-pC ipc call lock focus; pkill -x hypridle; sleep 0.3; setsid -f hypridle >/dev/null 2>&1
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = qs -c end4-pC ipc call lock activate
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
